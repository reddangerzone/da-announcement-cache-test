[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/announcement-test.jpg"
  to = "/.netlify/functions/announcement-test"
  status = 200
  force = true

[[headers]]
  for = "/announcement-test.jpg"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
